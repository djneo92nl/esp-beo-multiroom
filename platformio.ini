; ESP32 network speaker: a proof of concept that appears as a B&O Mozart product and
; (Phase 2) plays NetworkLink audio to a PCM5102. Unofficial; see docs/esp32-port.
;
; Same platform and release as garnet_web's examples (PlatformIO keeps one Arduino
; core package, so projects on different releases keep replacing each other's core).

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; No OTA (decision after Phase 0): one big app slot instead of two 1.25 MB ones.
board_build.partitions = partitions.csv
; Hybrid compile of the IDF libs (pioarduino): the shipped lwIP has IPv4 reassembly off, which
; drops every 3-fragment FPS datagram, and 16 sockets are all used up by the five servers.
custom_sdkconfig =
  CONFIG_LWIP_IP4_REASSEMBLY=y
  CONFIG_LWIP_MAX_SOCKETS=24
  CONFIG_HTTPD_WS_POST_HANDSHAKE_CB_SUPPORT=y
  ; Heap is the scarce resource (findings.md 4.3, measured): 85 KB free at boot with everything
  ; up, and the stream's own traffic then takes most of the rest. Shrink what the radio holds.
  CONFIG_BT_ENABLED=n
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=6
  CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=12
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=8
  CONFIG_ESP_WIFI_RX_BA_WIN=4
  CONFIG_LWIP_IP_REASS_MAX_PBUFS=10
  CONFIG_ARDUINO_LOOP_STACK_SIZE=6144
build_flags =
  -D GARNET_WEB_WIFI
  -D CORE_DEBUG_LEVEL=3
  -D GW_UI_PORT=8000
; Local checkouts next to this repo. To use the published libraries instead:
;   https://github.com/djneo92nl/garnet_web.git#v0.1.1
lib_deps =
  symlink://../garnet_settings
  symlink://../garnet_web
